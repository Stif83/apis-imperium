# Modèle : copier, remplacer chaque valeur, puis « oc apply -n apps-apisimperium -f » le fichier
# obtenu. Ne pas versionner le fichier rempli. Il n'est volontairement pas dans kustomization.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: apiculteur-secrets
type: Opaque
stringData:
  POSTGRES_USER: apiculteur
  POSTGRES_PASSWORD: CHANGER-MOI
  POSTGRES_DB: apiculteur
  # Sert uniquement à l'initialisation de la base (Keycloak local de développement)
  KEYCLOAK_DB_PASSWORD: CHANGER-MOI-AUSSI
  # Même mot de passe que POSTGRES_PASSWORD
  DATABASE_URL: postgresql+psycopg://apiculteur:CHANGER-MOI@postgres:5432/apiculteur
