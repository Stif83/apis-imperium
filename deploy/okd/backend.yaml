apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        # Le conteneur applique les migrations de base (alembic) avant de démarrer
        - name: backend
          image: apiculteur/backend
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: apiculteur-secrets, key: DATABASE_URL }
            - name: AUTH_MODE
              value: keycloak
            - name: KEYCLOAK_ISSUER
              valueFrom:
                configMapKeyRef: { name: apiculteur-config, key: KEYCLOAK_ISSUER }
            # Clés publiques lues par le réseau interne du cluster
            - name: KEYCLOAK_JWKS_URL
              value: http://keycloak-service.keycloak.svc:8080/realms/okd/protocol/openid-connect/certs
            - name: KEYCLOAK_CLIENT_ID
              valueFrom:
                configMapKeyRef: { name: apiculteur-config, key: KEYCLOAK_CLIENT_ID }
            # Autorité interne qui signe le certificat de Keycloak (ConfigMap facultative « keycloak-ca ») ;
            # ignorée si la ConfigMap n'existe pas
            - name: KEYCLOAK_CA_FILE
              value: /etc/keycloak-ca/ca.crt
          volumeMounts:
            - name: keycloak-ca
              mountPath: /etc/keycloak-ca
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
      volumes:
        - name: keycloak-ca
          configMap:
            name: keycloak-ca
            optional: true
