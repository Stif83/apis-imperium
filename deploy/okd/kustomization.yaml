# Déploiement : oc apply -k deploy/okd   (après avoir créé le Secret, voir secrets.example.yaml)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: apps-apisimperium

resources:
  - namespace.yaml
  - config.yaml
  - postgres.yaml
  - backend.yaml
  - frontend.yaml

# Les pods ne tirent que du registre interne du cluster, alimenté à la main depuis
# l'archive dist/apiculteur-images-<tag>.tar : aucun registre externe n'est contacté.
# Pour mettre à jour : pousser les nouvelles images puis changer newTag ici.
# PostgreSQL reste sur un tag inchangé tant que son image ne change pas : changer son tag le redémarre.
images:
  - name: apiculteur/postgres
    newName: image-registry.openshift-image-registry.svc:5000/apps-apisimperium/postgres
    newTag: "1.3.0"
  - name: apiculteur/backend
    newName: image-registry.openshift-image-registry.svc:5000/apps-apisimperium/backend
    newTag: "1.4.2"
  - name: apiculteur/frontend
    newName: image-registry.openshift-image-registry.svc:5000/apps-apisimperium/frontend
    newTag: "1.4.2"
